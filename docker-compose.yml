services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: iie
      POSTGRES_USER: iie_app
      POSTGRES_PASSWORD: iie_app
    ports:
      - "127.0.0.1:55433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iie_app -d iie"]
      interval: 5s
      timeout: 3s
      retries: 15

volumes:
  postgres_data:
