server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name iie.cskaoyan.cn;

    client_max_body_size 32m;

    ssl_certificate /etc/letsencrypt/live/iie.cskaoyan.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/iie.cskaoyan.cn/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location = /connection-test.html {
        default_type text/html;
        charset utf-8;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        return 200 '<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IIE Connection Test</title></head><body><h1>Connection OK</h1><p>HTTPS 443 static response from Nginx.</p></body></html>';
    }

    location = /249b4530797345e22c8cef76e62a0377.txt {
        default_type text/plain;
        add_header Cache-Control "no-store" always;
        return 200 '0c5289b1bbe6642dbff9c4665c4d9b650140a694';
    }

    location /api/ {
        proxy_pass http://127.0.0.1:9000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        proxy_pass http://127.0.0.1:9000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name iie.cskaoyan.cn;

    location = /249b4530797345e22c8cef76e62a0377.txt {
        default_type text/plain;
        add_header Cache-Control "no-store" always;
        return 200 '0c5289b1bbe6642dbff9c4665c4d9b650140a694';
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
